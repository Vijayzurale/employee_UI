<div class="table-wrapper">

  <h4 class="table-title">Employee List</h4>

  <table class="employee-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Contact</th>
        <th>Email</th>
        <th>Designation</th>
        <th>Department</th>
        <th>City</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let emp of EmployeeList(); let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ emp.name }}</td>
        <td>{{ emp.contactNo }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.designationName }}</td>
        <td>{{ emp.departmentName }}</td>
        <td>{{ emp.city }}</td>

        <td>
          <span class="role-badge">{{ emp.role }}</span>
        </td>
        <td>
          <button [routerLink]="'/New-Employee/' + emp.employeeId" class="edit-btn">Edit</button>
          <button class="delete-btn" (click)="ondelete(emp.employeeId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
